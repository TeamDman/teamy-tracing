[package]
name = "teamy-tracing-upstream-comparison"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
teamy-tracing = { path = "../.." }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "registry", "env-filter"] }
facet = { package = "teamy-facet", version = "=0.50.0-rc.7" }
facet-json = { package = "teamy-facet-json", version = "=0.50.0-rc.9" }
facet-value = { package = "teamy-facet-value", version = "=0.50.0-rc.9" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

[[bench]]
name = "formatting"
harness = false

[[bench]]
name = "cache_costs"
harness = false
