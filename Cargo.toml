[package]
name = "teamy-tracing"
version = "0.2.1"
edition = "2024"
rust-version = "1.96"
description = "Facet JSON formatting for upstream tracing-subscriber"
license = "MPL-2.0"
repository = "https://github.com/TeamDman/teamy-tracing"
readme = "README.md"
# Maintainer gates and the isolated comparison workspace run only from a checkout.
exclude = ["/scripts", "/validation", "/AGENTS.md"]

[dependencies]
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry"] }
facet-json = { package = "teamy-facet-json", version = "=0.50.0-rc.10", default-features = false }
facet-format = { package = "teamy-facet-format", version = "=0.50.0-rc.10", default-features = false }
facet = { package = "teamy-facet", version = "=0.50.0-rc.8" }
egui = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts"] }
opentelemetry-proto = { version = "0.31.0", optional = true, default-features = false, features = ["gen-tonic-messages", "logs"] }
prost = { version = "0.14.1", optional = true }
axum = { version = "0.8.9", optional = true, default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.49.0", optional = true, features = ["io-util", "net", "rt", "sync", "time"] }
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

[features]
default = []
telemetry = []
otlp = ["telemetry", "dep:opentelemetry-proto", "dep:prost"]
otlp-http = ["otlp", "dep:axum", "dep:tokio"]
egui = ["telemetry", "dep:egui"]
synthetic-viewer = ["egui", "dep:eframe"]

[[example]]
name = "synthetic_telemetry_viewer"
required-features = ["synthetic-viewer"]

[dev-dependencies]
facet-value = { package = "teamy-facet-value", version = "=0.50.0-rc.10" }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter"] }
tracing-error = "0.2.1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
allow_attributes = "deny"
