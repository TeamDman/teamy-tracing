[package]
name = "teamy-tracing"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
description = "Report-aware capture, GUI diagnostics, and Facet JSON formatting for tracing"
license = "MPL-2.0 AND MIT AND LiLiQ-R-1.1"
repository = "https://github.com/TeamDman/teamy-tracing"
readme = "README.md"
# Maintainer gates and standalone packages run from a checkout.
exclude = ["/scripts", "/validation", "/examples/synthetic-telemetry-viewer", "/AGENTS.md"]

[dependencies]
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry"] }
facet-json = { package = "teamy-facet-json", version = "=0.50.0-rc.12", default-features = false }
facet-format = { package = "teamy-facet-format", version = "=0.50.0-rc.11", default-features = false }
facet = { package = "teamy-facet", version = "=0.50.0-rc.10" }
egui = { version = "0.36.2", optional = true, default-features = false, features = ["default_fonts"] }
opentelemetry-proto = { version = "0.31.0", optional = true, default-features = false, features = ["gen-tonic-messages", "logs"] }
prost = { version = "0.14.1", optional = true }
axum = { version = "0.8.9", optional = true, default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.49.0", optional = true, features = ["io-util", "net", "rt", "sync", "time"] }

eyre = { version = "0.6.12", optional = true }
owo-colors = { version = "4.3.0", optional = true, features = ["supports-colors"] }

[features]
default = []
capture = ["dep:owo-colors"]
eyre = ["capture", "dep:eyre"]
telemetry = []
otlp = ["telemetry", "dep:opentelemetry-proto", "dep:prost"]
otlp-http = ["otlp", "dep:axum", "dep:tokio"]
egui = ["telemetry", "capture", "dep:egui"]

[dev-dependencies]
facet-value = { package = "teamy-facet-value", version = "=0.50.0-rc.11" }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter"] }
tracing-error = "0.2.1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
allow_attributes = "deny"
